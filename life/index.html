const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFromPass(pw){const bk=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.salt),iterations:D.iter,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},true,['decrypt']);}
async function keyFromRaw(raw){return crypto.subtle.importKey('raw',b64(raw),{name:'AES-GCM'},true,['decrypt']);}
async function show(key,remember){if(document.readyState!=='complete')await new Promise(r=>addEventListener('load',r,{once:true}));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.iv)},key,b64(D.ct));if(remember){const raw=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',key))));localStorage.setItem('life.key',raw);}const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();}
(async()=>{const raw=localStorage.getItem('life.key');if(raw){try{await show(await keyFromRaw(raw),false);return;}catch(e){localStorage.removeItem('life.key');}}
document.getElementById('f').addEventListener('submit',async ev=>{ev.preventDefault();const e=document.getElementById('e');e.textContent='unlocking…';try{await show(await keyFromPass(document.getElementById('p').value),document.getElementById('r').checked);}catch(err){e.textContent='wrong passphrase';}});})();
